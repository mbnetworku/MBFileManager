name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VER=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk MBFileManager-v$VER.apk
          cp app/build/outputs/apk/release/app-release.apk MBFileManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MBFileManager-apk
          path: MBFileManager-v*.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: MB File Manager v${{ env.VER }}
          files: |
            MBFileManager-v*.apk
            MBFileManager.apk
          make_latest: true
          body: |
            MB File Manager for Android 5.0+.
            Download the APK below and install it on your phone.
