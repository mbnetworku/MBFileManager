name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Offline guarantee - editing and AI code must not use the network
        run: |
          D=app/src/main/java/com/mbnetwork/filemanager
          FILES="$D/SmartTools.kt $D/PhotoEditorActivity.kt $D/EditorCanvas.kt $D/ImageUtil.kt $D/PhotoViewerActivity.kt $D/ZoomImageView.kt $D/VideoEditorActivity.kt $D/VideoTrimmer.kt $D/VideoPlayerActivity.kt $D/BgRemover.kt"
          if grep -nE "java\.net|HttpURLConnection|HttpsURLConnection|okhttp|WebView|https?://|URL\(" $FILES; then
            echo "::error::Network code found in an editing / AI file"; exit 1
          fi
          if grep -nEi "mlkit|firebase|play-services|openai|anthropic|retrofit" app/build.gradle.kts; then
            echo "::error::Online AI library found (okhttp is allowed on purpose: it is used by the Network & cloud package only)"; exit 1
          fi
          echo "OK: editing and AI code is offline"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key from secrets
        env:
          KEY_B64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MBFM_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          else
            echo "::warning::SIGNING_KEY_BASE64 secret not set - using a temporary debug key (updates will need uninstall)."
          fi
      - name: Build release APK
        env:
          MBFM_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MBFM_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MBFM_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VER=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk MBFileManager-v$VER.apk
          cp app/build/outputs/apk/release/app-release.apk MBFileManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MBFileManager-apk
          path: MBFileManager-v*.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: MB File Manager v${{ env.VER }}
          files: |
            MBFileManager-v*.apk
            MBFileManager.apk
          make_latest: true
          body: |
            MB File Manager for Android 5.0+.
            Download the APK below and install it on your phone.
      - name: Android 5 (API 21) compatibility check - lint NewApi (report only, runs when the commit message contains [lint])
        if: contains(github.event.head_commit.message, '[lint]')
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintRelease
          echo "===== NewApi report (API 21 compatibility) ====="
          if [ -s app/stdout ]; then cat app/stdout; else echo "No issues found: nothing needs a newer Android than 5.0"; fi
          echo "===== end of report ====="
